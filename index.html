/* =========================================================================
   TIMELINE
   ========================================================================= */
const TL = {
  chains: [],
  run(steps) { this.chains.push({ steps, i: 0, t: 0, started: false }); },
  clear() { this.chains.length = 0; },
  update(dt) {
    for (let ci = this.chains.length - 1; ci >= 0; ci--) {
      const c = this.chains[ci];
      if (c.i >= c.steps.length) { this.chains.splice(ci, 1); continue; }
      const s = c.steps[c.i];
      if (!c.started) { c.started = true; if (s.on) s.on(); }
      c.t += dt;
      const k = s.d > 0 ? clamp(c.t / s.d, 0, 1) : 1;
      if (s.upd) s.upd(k, dt);
      if (c.t >= s.d) { if (s.end) s.end(); c.i++; c.t = 0; c.started = false; }
    }
  }
};

/* =========================================================================
   GAME FLOW
   ========================================================================= */
function disposeWorld() {
  if (!W) return;
  scene.remove(W.group);
  disposeObj(W.group);
  if (PL && PL.g.parent) { PL.g.parent.remove(PL.g); }
  if (PL && PL.sh.parent) { PL.sh.parent.remove(PL.sh); }
  W = null;
}

function enterChapter(i) {
  disposeWorld();
  G.ch = i; G.got = 0; G.unlocked = false; G.sinceGot = 0; G.walked = 0; G.walkLine = 0;
  const cfg = CHAPTERS[i];
  G.need = cfg.lanterns;
  W = buildWorld(cfg);
  scene.add(PL.g); scene.add(PL.sh);
  PL.pos.copy(W.spawn);
  PL.g.position.copy(PL.pos);
  const toDoor = new THREE.Vector3().subVectors(W.door.pos, PL.pos).setY(0).normalize();
  PL.face = Math.atan2(toDoor.x, toDoor.z);
  PL.g.rotation.y = PL.face;
  IN.yaw = PL.face + Math.PI;
  IN.pitch = .24; IN.dist = 7.6;
  $('chapName').textContent = cfg.title;
  setOrbsUI(0, cfg.lanterns);
  $('hud').classList.remove('hidden');
  if (cfg.lanterns === 0) { G.unlocked = true; W.door.panelMat.uniforms.uLit.value = 1; }
  MUS.play(cfg.bgm, {
    fadeIn: 4.5, fadeOut: 3.0, level: cfg.bgmLevel || 1,
    intensity: cfg.bgmIntensity !== undefined ? cfg.bgmIntensity : intensityFor(0, cfg.lanterns)
  });
  showCard(cfg);
  SFX.chapter();
  fadeTo(0, 3.4);
  IN.enabled = true;
  G.state = 'play';
  if (i === 0) {
    setTimeout(() => tip('左：あるく ／ 右：みまわす', 7000), 3600);
    setTimeout(() => say('ひかりを あつめると、\nとびらが ひらく。', 6000), 8500);
  }
}

function intensityFor(got, need) {
  if (!need) return .5;
  return clamp(.42 + .58 * (got / need), 0, 1);
}

function collect(l, idx) {
  l.taken = true;
  G.got++;
  G.sinceGot = 0;
  SFX.pickup(G.got - 1);
  setOrbsUI(G.got, G.need);
  const cfg = CHAPTERS[G.ch];
  if (cfg.lines[G.got - 1]) say(cfg.lines[G.got - 1], 6000);
  MUS.setIntensity(intensityFor(G.got, G.need));
  /* ドアの上の玉に ともる */
  const orb = W.door.orbs[G.got - 1];
  if (orb) {
    orb.lit = true;
    orb.sp.material.opacity = 1;
    TL.run([{ d: 1.2, upd: k => { orb.ha.material.opacity = k * .9; orb.ha.scale.setScalar(1.5 + k * 1.4); } }]);
  }
  /* 光の粒が飛び散る */
  burst(l.pos.clone().setY(l.pos.y + 1.5), cfg.lantern);
  TL.run([{
    d: .9, upd: k => {
      l.g.scale.setScalar(1 + k * 2.2);
      l.core.material.opacity = 1 - k;
      l.halo.material.opacity = .85 * (1 - k);
      l.colMat.uniforms.uI.value = .55 * (1 - k);
      l.ring.forEach(s => s.material.opacity = .9 * (1 - k));
    },
    end: () => { l.g.visible = false; }
  }]);

  if (G.got >= G.need) unlockDoor();
}

function unlockDoor() {
  G.unlocked = true;
  SFX.unlock();
  AU.duck(.55, 3.2);
  setTimeout(() => say('とびらが、ひらく じゅんびを した。', 5200), 900);
  TL.run([{
    d: 3.0, upd: k => {
      const e = easeOut(k);
      W.door.panelMat.uniforms.uLit.value = .10 + e * .90;
      W.door.glow.material.opacity = .12 + e * .30;
      if (W.door.colMat) W.door.colMat.uniforms.uI.value = .18 + e * .52;
    }
  }]);
}

let burstPool = [];
function burst(pos, color) {
  const n = 26;
  const p = new Float32Array(n * 3), v = [];
  for (let i = 0; i < n; i++) {
    p[i * 3] = pos.x; p[i * 3 + 1] = pos.y; p[i * 3 + 2] = pos.z;
    const a = Math.random() * TAU, e = Math.random() * Math.PI;
    v.push(new THREE.Vector3(Math.sin(e) * Math.cos(a), Math.abs(Math.cos(e)) * 1.4 + .4, Math.sin(e) * Math.sin(a))
      .multiplyScalar(1.6 + Math.random() * 3.4));
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  const m = new THREE.PointsMaterial({
    size: .55, map: TEX.mote, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, color: new THREE.Color(color), opacity: 1, sizeAttenuation: true
  });
  const pts = new THREE.Points(g, m);
  pts.frustumCulled = false;
  scene.add(pts);
  const item = { pts, v, life: 0, max: 1.8, g, m };
  burstPool.push(item);
}
function updateBursts(dt) {
  for (let i = burstPool.length - 1; i >= 0; i--) {
    const b = burstPool[i];
    b.life += dt;
    const arr = b.g.attributes.position.array;
    for (let k = 0; k < b.v.length; k++) {
      b.v[k].y -= 3.2 * dt;
      b.v[k].multiplyScalar(1 - dt * .9);
      arr[k * 3] += b.v[k].x * dt; arr[k * 3 + 1] += b.v[k].y * dt; arr[k * 3 + 2] += b.v[k].z * dt;
    }
    b.g.attributes.position.needsUpdate = true;
    b.m.opacity = clamp(1 - b.life / b.max, 0, 1);
    if (b.life >= b.max) {
      scene.remove(b.pts); b.g.dispose(); b.m.dispose();
      burstPool.splice(i, 1);
    }
  }
}

/* -------------------------------------------------------- opening a door */
function onOpenDoor() {
  if (G.state !== 'play' || !G.unlocked || W.door.opened) return;
  W.door.opened = true;
  G.state = 'door';
  IN.enabled = false;
  IN.mv.x = IN.mv.y = 0;
  $('btnOpen').classList.remove('show');
  $('joy').classList.remove('on');
  $('hud').classList.add('hidden');
  $('say').classList.remove('show');

  const d = W.door;
  const front = d.pos.clone().addScaledVector(d.front, 2.4);
  front.y = W.H(front.x, front.z);
  const inside = d.pos.clone().addScaledVector(d.front, -.4);
  inside.y = W.H(inside.x, inside.z);
  const startPos = PL.pos.clone();
  const camStart = camera.position.clone();
  const targetYaw = Math.atan2(d.front.x, d.front.z) + Math.PI;

  SFX.door(CHAPTERS[G.ch].variant);
  AU.duck(.18, 6.5);

  const last = G.ch >= CHAPTERS.length - 1;

  TL.run([
    { /* ドアの前まで あるく */
      d: 1.9, upd: k => {
        const e = easeInOut(k);
        PL.pos.lerpVectors(startPos, front, e);
        PL.pos.y = W.H(PL.pos.x, PL.pos.z);
        PL.speed = 1;
        PL.face = lerpAngle(PL.face, targetYaw, .06);
        IN.yaw = lerpAngle(IN.yaw, targetYaw + Math.PI, .04);
        IN.dist = lerp(IN.dist, 5.4, .03);
      }
    },
    { /* ドアが ひらく */
      d: 2.4,
      on: () => { for (let i = 0; i < 3; i++) setTimeout(() => burst(d.pos.clone().setY(d.pos.y + 2.1), '#fff2d2'), i * 260); },
      upd: (k, dt) => {
        const e = easeInOut(k);
        d.panelMat.uniforms.uOpen.value = e;
        d.glow.material.opacity = .42 + Math.sin(k * Math.PI) * .9;
        d.glow.scale.setScalar(6.4 + e * 13);
        if (d.colMat) d.colMat.uniforms.uI.value = .8 + e * 1.1;
        PL.pos.lerp(inside, .022);
        PL.pos.y = W.H(PL.pos.x, PL.pos.z);
        PL.speed = .55;
        IN.dist = lerp(IN.dist, 3.4, .02);
        IN.pitch = lerp(IN.pitch, .16, .02);
      }
    },
    { /* まばゆい ひかり */
      d: 2.0,
      on: () => { fadeTo(1, 2.0); MUS.stopAll(2.2); },
      upd: k => { PL.speed = .3; d.glow.scale.setScalar(20 + k * 34); }
    },
    {
      d: .6, end: () => {
        if (last) startEnding();
        else { enterChapter(G.ch + 1); }
      }
    }
  ]);
}

function lerpAngle(a, b, t) {
  let d = ((b - a + Math.PI * 3) % TAU) - Math.PI;
  return a + d * t;
}

/* =========================================================================
   ENDING
   ========================================================================= */
function buildEndingWorld() {
  disposeWorld();
  const w = { group: new THREE.Group(), anim: [], sway: [], lanterns: [], t: 0 };
  scene.add(w.group);
  const cfg = {
    sky: { top: '#82b4e6', mid: '#dcc9e6', bot: '#ffcda2', sun: '#ffd7a4', sunDir: [0, .10, -1], pow: 34 },
    fog: { color: '#eddadd', density: .0100 }
  };
  scene.fog = new THREE.FogExp2(new THREE.Color(cfg.fog.color), cfg.fog.density);
  renderer.setClearColor(new THREE.Color(cfg.fog.color), 1);

  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      uTop: { value: new THREE.Color(cfg.sky.top) }, uMid: { value: new THREE.Color(cfg.sky.mid) },
      uBot: { value: new THREE.Color(cfg.sky.bot) }, uSun: { value: new THREE.Color(cfg.sky.sun) },
      uSunDir: { value: new THREE.Vector3().fromArray(cfg.sky.sunDir).normalize() },
      uPow: { value: cfg.sky.pow }, uSunI: { value: .38 }
    }, vertexShader: SKY_VS, fragmentShader: SKY_FS
  });
  w.group.add(new THREE.Mesh(new THREE.SphereGeometry(700, 24, 16), skyMat));

  w.group.add(new THREE.HemisphereLight(new THREE.Color('#ffeadd'), new THREE.Color('#a8b3a6'), .66));
  const dl = new THREE.DirectionalLight(new THREE.Color('#fff0d8'), .40);
  dl.position.set(0, 40, -80); w.group.add(dl);

  /* やわらかな地面 */
  const H = (x, z) => Math.sin(x * .020) * 2.2 + Math.cos(z * .017) * 1.9
    + Math.sin((x + z) * .0075) * 2.6 + Math.cos(x * .062 - z * .05) * .35;
  w.H = H;
  const g = new THREE.PlaneGeometry(600, 600, 90, 90);
  g.rotateX(-Math.PI / 2);
  const p = g.attributes.position;
  const col = new Float32Array(p.count * 3);
  const c1 = new THREE.Color('#dae0bc'), c2 = new THREE.Color('#c4bade');
  const tc = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    p.setY(i, H(x, z));
    tc.copy(c1).lerp(c2, clamp(smoothstep(-30, 150, -z) * .75 + Math.sin(x * .035) * .16 + Math.cos(z * .028) * .12, 0, 1));
    const vv = .92 + Math.sin(x * .21) * .05 + Math.cos(z * .17) * .05;
    col[i * 3] = tc.r * vv; col[i * 3 + 1] = tc.g * vv; col[i * 3 + 2] = tc.b * vv;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.computeVertexNormals();
  w.group.add(new THREE.Mesh(g, new THREE.MeshPhongMaterial({ shininess: 0, specular: 0x000000, vertexColors: true, flatShading: true })));

  /* 草と 木 */
  {
    const fg = new THREE.ConeGeometry(.14, .48, 4); fg.translate(0, .24, 0);
    const fm = new THREE.MeshPhongMaterial({
      shininess: 0, specular: 0x000000, flatShading: true, emissive: new THREE.Color('#2e2a22')
    });
    const n2 = 1500, fi = new THREE.InstancedMesh(fg, fm, n2);
    const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), cc = new THREE.Color();
    const cols = ['#fff0c6', '#ffd2df', '#efe6ff', '#fffaee'];
    for (let i = 0; i < n2; i++) {
      const q2 = Math.random();
      const x = (Math.random() - .5) * (q2 < .6 ? 60 : 190), z = -Math.random() * 230 + 40;
      q.setFromEuler(new THREE.Euler((Math.random() - .5) * .3, Math.random() * TAU, (Math.random() - .5) * .3));
      const sc2 = .5 + Math.random() * .7;
      m4.compose(new THREE.Vector3(x, H(x, z), z), q, new THREE.Vector3(sc2, sc2 * 1.1, sc2));
      fi.setMatrixAt(i, m4);
      cc.set(cols[(Math.random() * cols.length) | 0]); fi.setColorAt(i, cc);
    }
    fi.instanceMatrix.needsUpdate = true;
    if (fi.instanceColor) fi.instanceColor.needsUpdate = true;
    w.group.add(fi);

    const trunkG = new THREE.CylinderGeometry(.16, .3, 1, 5); trunkG.translate(0, .5, 0);
    const c1t = new THREE.ConeGeometry(1, 1.5, 6); c1t.translate(0, 1.35, 0);
    const c2t = new THREE.ConeGeometry(.72, 1.25, 6); c2t.translate(0, 2.15, 0);
    const c3t = new THREE.ConeGeometry(.44, 1.0, 6); c3t.translate(0, 2.85, 0);
    const leafG = mergeGeos([c1t, c2t, c3t]);
    const tm = new THREE.MeshPhongMaterial({ shininess: 0, specular: 0x000000, flatShading: true });
    const trm = new THREE.MeshPhongMaterial({ shininess: 0, specular: 0x000000, color: new THREE.Color('#b09a86'), flatShading: true });
    const N = 22;
    const ti = new THREE.InstancedMesh(trunkG, trm, N), li = new THREE.InstancedMesh(leafG, tm, N);
    const tcol = ['#e7c3cf', '#d9c9e6', '#f0d9bd'];
    for (let i = 0; i < N; i++) {
      const side = i % 2 ? 1 : -1;
      const x = side * (22 + Math.random() * 70), z = 20 - Math.random() * 230;
      const hgt = 3.4 + Math.random() * 2.6, wid = 1.1 + Math.random() * .8;
      q.setFromEuler(new THREE.Euler(0, Math.random() * TAU, 0));
      const pv = new THREE.Vector3(x, H(x, z) - .1, z);
      m4.compose(pv, q, new THREE.Vector3(wid * .5, hgt * .46, wid * .5)); ti.setMatrixAt(i, m4);
      m4.compose(pv, q, new THREE.Vector3(wid, hgt * .36, wid)); li.setMatrixAt(i, m4);
      cc.set(tcol[(Math.random() * tcol.length) | 0]); li.setColorAt(i, cc);
    }
    ti.instanceMatrix.needsUpdate = true; li.instanceMatrix.needsUpdate = true;
    if (li.instanceColor) li.instanceColor.needsUpdate = true;
    w.group.add(ti); w.group.add(li);
  }

  /* あるいてきた とびらたち */
  w.doors = [];
  for (let i = 0; i < 5; i++) {
    const dcfg = { stars: false, lantern: '#ffe9c0' };
    const dz = -(38 + i * 34);
    const dx = Math.sin(i * 1.9) * (5 + i * 3.6);
    const dd = createDoor(w, new THREE.Vector3(dx, H(dx, dz), dz), Math.sin(i) * .4, dcfg, 0);
    dd.panelMat.uniforms.uLit.value = .55 - i * .07;
    dd.g.scale.setScalar(1 + i * .06);
    w.doors.push(dd);
  }

  /* 花びら */
  const n = 420, pp = new Float32Array(n * 3), sp = [];
  for (let i = 0; i < n; i++) {
    pp[i * 3] = (Math.random() - .5) * 90;
    pp[i * 3 + 1] = Math.random() * 55;
    pp[i * 3 + 2] = (Math.random() - .5) * 90;
    sp.push({ vy: .8 + Math.random() * 1.3, ph: Math.random() * TAU });
  }
  const pg = new THREE.BufferGeometry();
  pg.setAttribute('position', new THREE.BufferAttribute(pp, 3));
  const pm = new THREE.PointsMaterial({
    size: 1.35, map: TEX.petal, transparent: true, depthWrite: false,
    blending: THREE.NormalBlending, color: new THREE.Color('#f6b8c8'), opacity: .9, sizeAttenuation: true
  });
  const pts = new THREE.Points(pg, pm); pts.frustumCulled = false;
  w.group.add(pts);
  w.petals = { pts, sp, n };

  /* ひかりの粒 */
  const mn = 260, mp = new Float32Array(mn * 3), mph = new Float32Array(mn);
  for (let i = 0; i < mn; i++) {
    mp[i * 3] = (Math.random() - .5) * 140; mp[i * 3 + 1] = Math.random() * 26; mp[i * 3 + 2] = (Math.random() - .5) * 140;
    mph[i] = Math.random() * TAU;
  }
  const mg = new THREE.BufferGeometry();
  mg.setAttribute('position', new THREE.BufferAttribute(mp, 3));
  const mm = new THREE.PointsMaterial({
    size: .5, map: TEX.mote, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, color: new THREE.Color('#fff3d6'), opacity: .9, sizeAttenuation: true
  });
  const mpts = new THREE.Points(mg, mm); mpts.frustumCulled = false;
  w.group.add(mpts);
  w.motes = { pts: mpts, ph: mph, n: mn, cfg: { rise: .3, spread: 70, size: .5 } };

  W = w;
  scene.add(PL.g); scene.add(PL.sh);
  PL.pos.set(0, H(0, 0), 0);
  PL.face = Math.PI;
  return w;
}

function startEnding() {
  G.state = 'ending';
  $('hud').classList.add('hidden');
  buildEndingWorld();
  IN.yaw = 0; IN.pitch = .18; IN.dist = 7.5;
  camera.position.set(0, PL.pos.y + 3, 9);
  MUS.play('ending', { fadeIn: 6, fadeOut: 2, intensity: .8, level: 1.45 });
  SFX.finale();
  fadeTo(0, 5.0);
  const el = $('ending'), line = el.querySelector('.line');
  el.classList.remove('hidden');

  const steps = [{ d: 6.0 }];
  ENDING_LINES.forEach((t, i) => {
    steps.push({
      d: 3.0, on: () => { line.innerHTML = t.replace(/\n/g, '<br>'); line.classList.add('show'); }
    });
    steps.push({ d: 3.4, on: () => { line.classList.remove('show'); } });
  });
  steps.push({
    d: 5.0, on: () => { MUS.setIntensity(.35); }
  });
  steps.push({
    d: 4.5, on: () => { fadeTo(1, 4.4); el.classList.add('hidden'); }
  });
  steps.push({
    d: 1.0, on: () => {
      $('endCard').classList.remove('hidden');
      $('fade').style.background = '#fffaf2';
      G.state = 'end';
    }
  });
  TL.run(steps);
}

/* =========================================================================
   TITLE
   ========================================================================= */
function startTitle() {
  disposeWorld();
  TL.clear();
  G.state = 'title';
  G.ch = 0;
  W = buildWorld(CHAPTERS[0]);
  const d = W.door;
  W.door.panelMat.uniforms.uLit.value = .5;
  IN.enabled = false;
  IN.yaw = 0; IN.pitch = .34; IN.dist = 25;
  $('hud').classList.add('hidden');
  $('endCard').classList.add('hidden');
  $('ending').classList.add('hidden');
  $('fade').style.background = '#fff';
  fadeTo(0, 2.6);
  $('title').classList.remove('hidden');
  MUS.play('title', { fadeIn: 5, fadeOut: 2.5, intensity: 1 });
}

function beginJourney() {
  if (G.state !== 'title') return;
  SFX.ui(true);
  $('title').classList.add('hidden');
  G.state = 'intro';
  TL.run([
    { d: 1.6, on: () => fadeTo(1, 1.6) },
    { d: .2, end: () => { enterChapter(0); } }
  ]);
}

/* =========================================================================
   UPDATE
   ========================================================================= */
let _v1, _v2, _tgt, camTarget;   /* THREE 読み込み後に生成 */

function updatePlayer(dt) {
  const inp = (G.state === 'play' && IN.enabled) ? readInput() : { x: 0, y: 0, len: 0 };
  const cfg = CHAPTERS[G.ch];

  const fwd = _v1.set(-Math.sin(IN.yaw), 0, -Math.cos(IN.yaw));
  const rgt = _v2.set(Math.cos(IN.yaw), 0, -Math.sin(IN.yaw));
  const move = new THREE.Vector3().addScaledVector(fwd, inp.y).addScaledVector(rgt, inp.x);
  const len = Math.min(move.length(), 1);

  if (G.state === 'play') {
    const sp = 4.7 * len;
    PL.speed = lerp(PL.speed, len, 1 - Math.exp(-dt * 9));
    if (len > .02) {
      move.normalize();
      const wl = cfg.water ? cfg.water.level + .10 : -1e9;
      const step = sp * dt;
      const nx = PL.pos.x + move.x * step, nz = PL.pos.z + move.z * step;
      if (W.H(nx, nz) > wl) { PL.pos.x = nx; PL.pos.z = nz; }
      else if (W.H(nx, PL.pos.z) > wl) { PL.pos.x = nx; }
      else if (W.H(PL.pos.x, nz) > wl) { PL.pos.z = nz; }
      PL.face = lerpAngle(PL.face, Math.atan2(move.x, move.z), 1 - Math.exp(-dt * 9));
      G.walked += step;
      IN.camIdle += dt;
      if (IN.camIdle > 1.6 && IN.camId < 0) {
        IN.yaw = lerpAngle(IN.yaw, PL.face + Math.PI, 1 - Math.exp(-dt * .9));
      }
    }
    /* しま の きわ */
    const R = cfg.radius;
    const r = Math.hypot(PL.pos.x, PL.pos.z);
    if (r > R * .93) {
      const push = (r - R * .93) * 3.4 * dt;
      PL.pos.x -= (PL.pos.x / r) * push * 6;
      PL.pos.z -= (PL.pos.z / r) * push * 6;
      if (!G.edgeMsg || G.t - G.edgeMsg > 14) { G.edgeMsg = G.t; tip('この さきは、きりの なか。', 3200); }
    }
  } else if (G.state === 'ending') {
    PL.speed = lerp(PL.speed, .55, 1 - Math.exp(-dt * 2));
    PL.pos.z -= 1.5 * dt;
    IN.dist = lerp(IN.dist, 12.5, 1 - Math.exp(-dt * .045));
    IN.yaw += dt * .012;
    PL.face = lerpAngle(PL.face, Math.PI, 1 - Math.exp(-dt * 2));
  }

  if (W && W.H) PL.pos.y = W.H(PL.pos.x, PL.pos.z);
  PL.g.position.copy(PL.pos);
  PL.g.rotation.y = PL.face;

  /* あるく しぐさ */
  PL.phase += PL.speed * dt * 8.2;
  const s = Math.sin(PL.phase), c = Math.cos(PL.phase * 2);
  PL.legL.rotation.x = s * .62 * PL.speed;
  PL.legR.rotation.x = -s * .62 * PL.speed;
  PL.armL.rotation.x = -s * .45 * PL.speed;
  PL.armR.rotation.x = s * .45 * PL.speed;
  PL.g.position.y += Math.abs(c) * .045 * PL.speed;
  PL.body.rotation.z = s * .04 * PL.speed;
  PL.cape.rotation.x = -s * .05 * PL.speed;
  PL.lamp.material.opacity = .24 + .10 * Math.sin(G.t * 1.7);

  /* あしおと */
  if (PL.speed > .12 && (G.state === 'play' || G.state === 'ending')) {
    PL.stepT += dt * PL.speed;
    const iv = .46;
    if (PL.stepT > iv) {
      PL.stepT = 0;
      const root = [60, 57, 62, 62][G.ch] || 60;
      SFX.step(root);
    }
  }

  /* かげ */
  if (W && W.H) {
    PL.sh.position.set(PL.pos.x, PL.pos.y + .07, PL.pos.z);
    const sc = 1 + PL.speed * .1;
    PL.sh.scale.set(sc, sc, sc);
  }
}

function updateCamera(dt) {
  if (G.state === 'title') {
    IN.yaw += dt * .045;
    const d = W.door.pos;
    _tgt.set(d.x, d.y + 3.4, d.z);
    const off = new THREE.Vector3(
      Math.sin(IN.yaw) * Math.cos(IN.pitch), Math.sin(IN.pitch) + .05, Math.cos(IN.yaw) * Math.cos(IN.pitch)
    ).multiplyScalar(IN.dist);
    camera.position.lerp(_tgt.clone().add(off), 1 - Math.exp(-dt * 1.2));
    camTarget.lerp(_tgt, 1 - Math.exp(-dt * 2));
    camera.lookAt(camTarget);
    return;
  }
  const hd = G.state === 'ending' ? 2.1 : 1.62;
  _tgt.set(PL.pos.x, PL.pos.y + hd, PL.pos.z);
  const off = new THREE.Vector3(
    Math.sin(IN.yaw) * Math.cos(IN.pitch), Math.sin(IN.pitch) + .05, Math.cos(IN.yaw) * Math.cos(IN.pitch)
  ).multiplyScalar(IN.dist);
  const want = _tgt.clone().add(off);
  if (W && W.H) {
    let gy = W.H(want.x, want.z) + 1.3;
    const wc = CHAPTERS[G.ch] && CHAPTERS[G.ch].water;
    if (G.state !== 'ending' && wc) gy = Math.max(gy, wc.level + 1.6);
    if (want.y < gy) want.y = gy;
  }
  camera.position.lerp(want, 1 - Math.exp(-dt * 4.2));
  camTarget.lerp(_tgt, 1 - Math.exp(-dt * 6));
  camera.lookAt(camTarget);
}

function updateWorld(dt) {
  if (!W) return;
  W.t += dt;
  const t = W.t;
  W.sway.forEach(u => u.value = t);
  if (W.water) W.water.uniforms.uT.value = t;

  /* motes */
  if (W.motes) {
    const m = W.motes, arr = m.pts.geometry.attributes.position.array;
    const cx = PL.pos.x, cz = PL.pos.z, sp = m.cfg.spread;
    for (let i = 0; i < m.n; i++) {
      arr[i * 3 + 1] += m.cfg.rise * dt * (.6 + (i % 7) * .12);
      arr[i * 3] += Math.sin(t * .35 + m.ph[i]) * dt * .35;
      arr[i * 3 + 2] += Math.cos(t * .29 + m.ph[i]) * dt * .35;
      if (arr[i * 3 + 1] > 24) arr[i * 3 + 1] = 0;
      let dx = arr[i * 3] - cx, dz = arr[i * 3 + 2] - cz;
      if (dx > sp) arr[i * 3] -= sp * 2; else if (dx < -sp) arr[i * 3] += sp * 2;
      if (dz > sp) arr[i * 3 + 2] -= sp * 2; else if (dz < -sp) arr[i * 3 + 2] += sp * 2;
    }
    m.pts.geometry.attributes.position.needsUpdate = true;
  }

  /* petals (ending) */
  if (W.petals) {
    const p = W.petals, arr = p.pts.geometry.attributes.position.array;
    for (let i = 0; i < p.n; i++) {
      const s = p.sp[i];
      arr[i * 3 + 1] -= s.vy * dt;
      arr[i * 3] += Math.sin(t * .8 + s.ph) * dt * 1.3;
      arr[i * 3 + 2] += Math.cos(t * .6 + s.ph) * dt * .8;
      if (arr[i * 3 + 1] < -2) {
        arr[i * 3 + 1] = 55;
        arr[i * 3] = PL.pos.x + (Math.random() - .5) * 90;
        arr[i * 3 + 2] = PL.pos.z + (Math.random() - .5) * 90;
      }
    }
    p.pts.geometry.attributes.position.needsUpdate = true;
  }

  /* clouds */
  W.anim.forEach(a => {
    if (a.kind === 'cloud') {
      a.o.position.x += a.sp * dt;
      if (a.o.position.x > 460) a.o.position.x = -460;
    }
  });

  /* floaters */
  if (W.floaters) W.floaters.forEach(f => {
    f.p += dt * .35;
    f.m.position.y = f.y0 + Math.sin(f.p) * 1.1;
    f.m.rotation.y += dt * .06;
  });

  /* lanterns */
  W.lanterns.forEach((l, i) => {
    if (l.taken) return;
    l.ph += dt;
    const y = 1.5 + Math.sin(l.ph * 1.25) * .22;
    l.core.position.y = y;
    l.halo.position.y = y;
    l.core.rotation.y += dt * .8;
    l.core.rotation.x += dt * .35;
    l.halo.scale.setScalar(2.6 + Math.sin(l.ph * 1.8) * .38);
    l.colMat.uniforms.uT.value = W.t;
    l.ring.forEach((s, k) => {
      const a = l.ph * .9 + k * TAU / 3;
      s.position.set(Math.sin(a) * .85, y + Math.sin(a * 2) * .3, Math.cos(a) * .85);
    });
    /* 長く見つからないと 光がつよくなる */
    if (G.sinceGot > 40) {
      const p = .55 + .45 * Math.sin(W.t * 2.2);
      l.colMat.uniforms.uI.value = .46 + p * .40;
    }
  });

  /* door */
  const dr = W.door;
  if (dr) {
    dr.panelMat.uniforms.uT.value = t;
    if (dr.colMat) dr.colMat.uniforms.uT.value = t;
    if (!dr.opened && G.unlocked) {
      dr.glow.scale.setScalar(6.4 + Math.sin(t * 1.1) * .9);
    }
  }
  if (W.backDoor) W.backDoor.panelMat.uniforms.uT.value = t;
  if (W.doors) W.doors.forEach(d2 => d2.panelMat.uniforms.uT.value = t);
}

function updatePlay(dt) {
  if (G.state !== 'play') return;
  G.sinceGot += dt;

  /* ひろう */
  for (let i = 0; i < W.lanterns.length; i++) {
    const l = W.lanterns[i];
    if (l.taken) continue;
    if (Math.hypot(PL.pos.x - l.pos.x, PL.pos.z - l.pos.z) < 1.9) collect(l, i);
  }

  /* ドアの前 */
  const d = W.door;
  const dist = Math.hypot(PL.pos.x - d.pos.x, PL.pos.z - d.pos.z);
  const btn = $('btnOpen');
  if (G.unlocked && dist < 3.6 && !d.opened) {
    if (!btn.classList.contains('show')) btn.classList.add('show');
  } else if (btn.classList.contains('show')) btn.classList.remove('show');

  if (!G.unlocked && dist < 4.2 && (!G.doorMsg || G.t - G.doorMsg > 16)) {
    G.doorMsg = G.t;
    say('あと ' + (G.need - G.got) + 'つ の ひかり。', 4000);
  }

  /* 第四章：あるいた ぶんだけ ことばが おちる */
  const cfg = CHAPTERS[G.ch];
  if (cfg.walkLines && G.walkLine < cfg.walkLines.length) {
    const need = 16 + G.walkLine * 22;
    if (G.walked > need) { say(cfg.walkLines[G.walkLine], 6000); G.walkLine++; }
  }
}

/* =========================================================================
   LOOP
   ========================================================================= */
let acc = 0, frames = 0, fpsT = 0;
function loop() {
  requestAnimationFrame(loop);
  let dt = clock.getDelta();
  if (dt > .12) dt = .12;
  G.t += dt;

  TL.update(dt);
  if (W) {
    updatePlayer(dt);
    updatePlay(dt);
    updateWorld(dt);
    updateCamera(dt);
    updateBursts(dt);
  }
  renderer.render(scene, camera);

  /* かんたんな 自動画質調整 */
  frames++; fpsT += dt;
  if (fpsT > 2.5) {
    const fps = frames / fpsT;
    frames = 0; fpsT = 0;
    if (fps < 34 && G.quality > .72) {
      G.quality = .72;
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2) * G.quality);
    }
  }
}

/* =========================================================================
   BOOT
   ========================================================================= */
function resize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  camera.fov = h > w ? 60 : 52;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}

function initGame() {
  const canvas = $('gl');
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.toneMapping = THREE.NoToneMapping;
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, .1, 1400);
  clock = new THREE.Clock();
  _v1 = new THREE.Vector3(); _v2 = new THREE.Vector3();
  _tgt = new THREE.Vector3(); camTarget = new THREE.Vector3();
  initTextures();
  PL = makePlayer();
  initInput();
  resize();
  addEventListener('resize', resize);
  addEventListener('orientationchange', () => setTimeout(resize, 220));

  $('btnOpen').addEventListener('click', e => { e.stopPropagation(); onOpenDoor(); });
  $('btnStart').addEventListener('click', e => { e.stopPropagation(); beginJourney(); });
  $('btnAgain').addEventListener('click', e => {
    e.stopPropagation();
    SFX.ui(false);
    $('endCard').classList.add('hidden');
    $('fade').style.background = '#fff';
    TL.clear();
    setTimeout(startTitle, 400);
  });
  $('btnMute').addEventListener('click', e => {
    e.stopPropagation();
    G.muted = !G.muted;
    AU.setMuted(G.muted);
    $('btnMute').textContent = G.muted ? '♪' : '♪';
    $('btnMute').classList.toggle('off', G.muted);
  });

  document.addEventListener('visibilitychange', () => {
    if (!AU.ctx) return;
    if (document.hidden) AU.ctx.suspend && AU.ctx.suspend();
    else { AU.ctx.resume && AU.ctx.resume(); clock.getDelta(); }
  });

  $('load').classList.add('gone');
  loop();

  const splash = $('splash');
  const go = () => {
    splash.removeEventListener('pointerdown', go);
    AU.init();
    if (AU.ctx && AU.ctx.state === 'suspended') AU.ctx.resume();
    splash.style.opacity = '0';
    splash.style.pointerEvents = 'none';
    setTimeout(() => { splash.style.display = 'none'; }, 1500);
    startTitle();
  };
  splash.addEventListener('pointerdown', go);
}

window.__startGame = function () {
  try { initGame(); }
  catch (err) {
    $('load').classList.remove('gone');
    $('load').textContent = 'よみこみに しっぱいしました';
    console.error(err);
  }
};

<script>
/* three.js を CDN から読み込む（順に試す） */
(function () {
  var CDNS = [
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
    'https://unpkg.com/three@0.128.0/build/three.min.js',
    'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
    'https://esm.sh/three@0.128.0/build/three.min.js'
  ];
  var i = 0;
  function next() {
    if (window.THREE) { window.__startGame(); return; }
    if (i >= CDNS.length) {
      var l = document.getElementById('load');
      l.classList.remove('gone');
      l.innerHTML = 'three.js を よみこめませんでした<br><span style="font-size:10px;letter-spacing:.2em">ネットワークを ご確認ください</span>';
      return;
    }
    var s = document.createElement('script');
    s.src = CDNS[i++];
    s.onload = function () { window.__startGame(); };
    s.onerror = next;
    document.head.appendChild(s);
  }
  next();
})();
</script>
